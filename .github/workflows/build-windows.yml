name: Crea gioco Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-windows:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4
      - name: Prepara template Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          mv /root/.local/share/godot/export_templates/4.7.1.stable/* ~/.local/share/godot/export_templates/4.7.1.stable/ 2>/dev/null || true
      - name: Controlla progetto
        run: godot --headless --path . --editor --quit
      - name: Esporta Windows
        run: godot --headless --path . --export-release "Windows Desktop" builds/IslandAwakening.exe
      - name: Carica gioco scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: IslandAwakening-Windows
          path: builds/IslandAwakening.exe
